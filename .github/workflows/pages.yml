name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Basic static checks
        run: |
          test -f index.html
          test -f assets/css/style.css
          test -f assets/js/core.js
          test -f assets/js/media.js
          test -f assets/js/export.js
          test -f assets/js/app.js
          test -f assets/js/i18n.js
          test -f sw.js
          test -f vendor/mp4-muxer.mjs
          test -f sitemap.xml
          test -f robots.txt

      - name: JavaScript syntax checks
        run: |
          node --check assets/js/core.js
          node --check assets/js/media.js
          node --check assets/js/export.js
          node --check assets/js/i18n.js
          node --check assets/js/app.js
          node --check sw.js

      - name: Core tests
        run: node --test

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
