name: Verify pull requests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check assets/js/local-workspace.js
          node --check assets/js/auth-client.js
          node --check assets/js/supabase-config.js
          node --check assets/js/studio-dashboard.js
          node --check assets/js/sound-hub.js
          node --check assets/js/sound-hub-ui.js
          node --check assets/js/win7-shell.js
          node --check assets/js/win7-start-menu.js
          node --check assets/js/export-preflight.js
          node --check assets/js/editor-templates.js
          node --check assets/js/tiktok-link.js
          node --check assets/js/tiktok-config.js
          node --check assets/js/bratcode.js
          node --check assets/js/backup-reminders.js
          node --check assets/js/dashboard-audio.js
          node --check assets/js/app.js
          node --check assets/js/editor-v5.js
          node --check assets/js/project-assets.js
          node --check sw.js
      - name: Run JavaScript unit tests
        run: node --test
  browser-regression:
    name: Browser regression / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - studio-dashboard
          - editor-v5
          - export-format
          - lyrics
          - motion
          - music-editor
          - natural-timing
          - project-assets
          - text-settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Find browser (required for regression)
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::Chrome/Chromium unavailable, browser regression cannot be skipped"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Run real browser regression
        run: node "tests/${{ matrix.suite }}-browser.mjs"

  tiktok-edge-check:
    name: Type-check TikTok Edge Function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate Supabase Edge Function TypeScript
        run: deno check supabase/functions/tiktok-link/index.ts
