name: Verify pull requests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check assets/js/local-workspace.js
          node --check assets/js/auth-client.js
          node --check assets/js/supabase-config.js
          node --check assets/js/studio-dashboard.js
          node --check assets/js/sound-hub.js
          node --check assets/js/sound-hub-ui.js
          node --check assets/js/win7-shell.js
          node --check assets/js/win7-start-menu.js
          node --check assets/js/win7-window-menu.js
          node --check assets/js/win7-boot.js
          node --check assets/js/export-preflight.js
          node --check assets/js/export-plan.js
          node --check assets/js/export-engine.js
          node --check assets/js/multitrack.js
          node --check assets/js/video-composer.js
          node --check assets/js/audio-mixer.js
          node --check assets/js/multitrack-ui.js
          node --check assets/js/timeline-core.js
          node --check assets/js/timeline-editor.js
          node --check assets/js/editor-templates.js
          node --check assets/js/tiktok-link.js
          node --check assets/js/tiktok-login.js
          node --check assets/js/tiktok-config.js
          node --check assets/js/bratcode.js
          node --check assets/js/backup-reminders.js
          node --check assets/js/win7-sound-pack.js
          node --check assets/js/dashboard-audio.js
          node --check assets/js/app.js
          node --check assets/js/editor-v5.js
          node --check assets/js/project-assets.js
          node --check sw.js
      - name: Run JavaScript unit tests
        run: node --test
  browser-regression:
    name: Browser regression / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - studio-dashboard
          - editor-v5
          - export-format
          - lyrics
          - motion
          - music-editor
          - natural-timing
          - project-assets
          - text-settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Find browser (required for regression)
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::Chrome/Chromium unavailable, browser regression cannot be skipped"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Run real browser regression
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2; do
            if node "tests/${{ matrix.suite }}-browser.mjs" 2>&1 | tee "/tmp/brat-browser-log-${{ matrix.suite }}.txt"; then
              exit 0
            fi
            if [ "$attempt" = 2 ] || ! grep -Eq 'Chrome DevTools did not start|Chrome failed to start|Chrome did not start' "/tmp/brat-browser-log-${{ matrix.suite }}.txt"; then
              exit 1
            fi
            echo "::warning::Chrome failed to start on hosted runner. Retrying browser launch once."
            sleep 2
          done

  layout-playwright:
    name: Playwright UI layout / desktop + mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve Chromium
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Install headless Playwright test runner
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.58.2
      - name: Audit real editor sections and save visual evidence
        run: node tests/editor-layout-playwright.mjs
      - name: Upload screenshots for manual visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-editor-layout
          path: artifacts/editor-layout/*.png
          if-no-files-found: ignore
          retention-days: 7

  tiktok-edge-check:
    name: Type-check TikTok Edge Function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate Supabase Edge Function TypeScript
        run: deno check supabase/functions/tiktok-link/index.ts
      - name: Verify TikTok SQL migrations and authorization
        run: deno run --no-lock --allow-read --allow-env --allow-sys tests/tiktok-database.mjs
